[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/schneiderfelipe/ostinato"
readme = "../../README.md"
keywords = ["music", "sequencer", "tui", "modal"]
categories = ["command-line-utilities", "multimedia::audio"]

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Transitive dependencies of ratatui/crossterm/cpal pull in a few duplicate versions of common
# crates (thiserror, bitflags, hashbrown, ...); that's upstream's call, not ours to fix here.
multiple_crate_versions = "allow"
